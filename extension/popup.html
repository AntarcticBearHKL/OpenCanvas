<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>OpenCanvas Image Cache</title>
    <style>
      :root {
        color-scheme: light dark;
      }
      * {
        box-sizing: border-box;
      }
      body {
        width: 320px;
        margin: 0;
        padding: 14px 14px 12px;
        font: 13px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei",
          sans-serif;
        color: #1c1917;
        background: #ffffff;
      }
      .head {
        margin-bottom: 10px;
      }
      h1 {
        margin: 0;
        font-size: 14px;
        font-weight: 600;
      }
      .count {
        margin: 4px 0 0;
        font-size: 12px;
        color: #78716c;
      }
      .list {
        margin: 0 0 10px;
        padding: 0;
        list-style: none;
        border: 1px solid rgba(120, 113, 108, 0.2);
        border-radius: 8px;
        overflow: hidden;
      }
      .list:empty {
        display: none;
      }
      .list li {
        display: flex;
        flex-direction: column;
        gap: 2px;
        padding: 6px 10px;
      }
      .list li + li {
        border-top: 1px solid rgba(120, 113, 108, 0.15);
      }
      .name {
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
      }
      .meta {
        font-size: 11px;
        color: #78716c;
      }
      .hint {
        margin: 0 0 10px;
        font-size: 12px;
        color: #78716c;
      }
      .clear {
        width: 100%;
        padding: 7px 10px;
        font: inherit;
        color: #b91c1c;
        background: rgba(185, 28, 28, 0.08);
        border: 1px solid rgba(185, 28, 28, 0.25);
        border-radius: 8px;
        cursor: pointer;
      }
      .clear:hover:not(:disabled) {
        background: rgba(185, 28, 28, 0.14);
      }
      .clear:disabled {
        color: #a8a29e;
        background: transparent;
        border-color: rgba(120, 113, 108, 0.25);
        cursor: default;
      }
      .status {
        margin: 8px 0 0;
        font-size: 12px;
        color: #15803d;
      }
      .status[data-error="1"] {
        color: #b91c1c;
      }
      @media (prefers-color-scheme: dark) {
        body {
          color: #f5f5f4;
          background: #1c1917;
        }
        .count,
        .meta,
        .hint {
          color: #a8a29e;
        }
        .clear:disabled {
          color: #57534e;
          border-color: rgba(168, 162, 158, 0.25);
        }
        .status {
          color: #4ade80;
        }
        .status[data-error="1"] {
          color: #f87171;
        }
      }
    </style>
  </head>
  <body>
    <header class="head">
      <h1>OpenCanvas 图片缓存</h1>
      <p id="count" class="count">读取中…</p>
    </header>
    <ul id="list" class="list"></ul>
    <p class="hint">在任意网页右键图片，选择「添加到 OpenCanvas 缓存」。</p>
    <button id="clear" type="button" class="clear">清空缓存</button>
    <p id="status" class="status" hidden></p>
    <script src="popup.js"></script>
  </body>
</html>
